<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Milgo Parfums - Luxury Fragrances & ERP</title>
    <meta name="description" content="Premier luxury perfume retail store and business management ERP in Somalia with bilingual Somali and English support." />
    <meta property="og:title" content="Milgo Parfums - Luxury Fragrances & ERP" />
    <meta property="og:description" content="Premier luxury perfume retail store and business management ERP in Somalia with bilingual Somali and English support." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Set the saved theme before first paint so night mode never flashes light
      try {
        if ((localStorage.getItem("milgo_theme") || "night") === "night") document.documentElement.classList.add("theme-night");
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@300..600&display=swap" rel="stylesheet">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "Milgo Parfums",
      "description": "High-end luxury fragrance boutique and perfume retailer in Somalia.",
      "currenciesAccepted": "USD, SOS",
      "paymentAccepted": "Cash on Delivery, EVC Plus, Zaad, Sahal, Edahab, Bank Transfer",
      "priceRange": "$$$",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Mogadishu",
        "addressCountry": "SO"
      }
    }
    </script>
  </head>
  <body class="bg-canvas text-fg font-sans antialiased selection:bg-[#c8a97e]/30 selection:text-fg min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
