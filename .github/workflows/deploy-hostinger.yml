# Builds the site on every push to main and publishes the ready-to-serve files (dist/)
# to the "hostinger" branch. Hostinger's Git deployment pulls that branch into public_html,
# because Hostinger only copies files and does not run the build itself.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      # Optional direct upload. Add these in GitHub: Settings -> Secrets and variables -> Actions.
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps: vite 8 is newer than some plugins' declared peer range
      - run: npm ci --legacy-peer-deps

      - run: npm run lint

      - run: npm run build

      - name: Publish dist/ to the hostinger branch
        uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          branch: hostinger
          folder: dist
          clean: true
          commit-message: 'Deploy ${{ github.sha }}'

      # Uploads dist/ straight into public_html over FTPS when the FTP secrets exist.
      # Only changed files are sent; the server config (outside public_html) is never touched.
      - name: Upload to Hostinger over FTP
        if: env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR || 'public_html/' }}
